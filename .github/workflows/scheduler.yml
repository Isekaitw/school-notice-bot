name: School Notice Bot

on:
  schedule:
    # cron 使用 UTC 時間。每小時的整點檢查一次（頻繁檢查，避免 RSS 只留最新 10 則導致漏抓）
    # 實際「發訊息」的時間點由 main.py 裡的 DIGEST_HOURS 控制，跟這裡的檢查頻率是分開的
    - cron: '0 * * * *'
  workflow_dispatch:  # 允許在 GitHub 網頁上手動觸發，方便測試

concurrency:
  group: school-notice-bot
  cancel-in-progress: false
  # 確保同一時間只有一個執行實例在跑，避免 GitHub 補跑積欠排程時
  # 好幾個執行同時搶著讀寫 last_checked.json / pending_matches.json，
  # 導致互相看不到對方最新的狀態、誤判成好幾次獨立的發送時機

permissions:
  contents: write  # 需要寫入權限才能 commit 回 last_checked.json / pending_matches.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notice bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          USER_CRITERIA: ${{ secrets.USER_CRITERIA }}
          DIGEST_HOURS: "6,16"  # 台灣時間，逗號分隔；只有這幾個小時才會真的發送彙整訊息
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_checked.json pending_matches.json
          git diff --staged --quiet || git commit -m "chore: update state files [skip ci]"
          git push
        
