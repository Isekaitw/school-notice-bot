name: School Notice Bot

on:
  schedule:
    # cron 使用 UTC 時間。每小時整點檢查一次，避免 RSS 只留最新 10 則導致漏抓
    - cron: '0 * * * *'
  workflow_dispatch:  # 允許在 GitHub 網頁上手動觸發，方便測試

concurrency:
  group: school-notice-bot
  cancel-in-progress: false

permissions:
  contents: write  # 需要寫入權限才能 commit 回 last_checked.json / matches.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notice bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          USER_CRITERIA: ${{ secrets.USER_CRITERIA }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_checked.json matches.json
          git diff --staged --quiet || git commit -m "chore: update state files [skip ci]"
          git push
